<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" fill="none">
  <!-- Soft Rounded Brand Emblem Base -->
  <rect width="28" height="28" rx="6" fill="#2563EB" />
  
  <!-- Clean Tree / Graph Traces -->
  <line x1="14" y1="8" x2="8" y2="20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85" />
  <line x1="14" y1="8" x2="20" y2="20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85" />
  <line x1="8" y1="20" x2="20" y2="20" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2" stroke-opacity="0.6" />
  
  <!-- 3 Clean Schematic Vertex Nodes -->
  <circle cx="14" cy="8" r="3" fill="#FFFFFF" />
  <circle cx="8" cy="20" r="3" fill="#FFFFFF" />
  <circle cx="20" cy="20" r="3" fill="#FFFFFF" />
</svg>
