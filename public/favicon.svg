<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" fill="none">
  <!-- Precision International Orange Hardware Base -->
  <rect width="28" height="28" rx="2" fill="#FF4F00" />
  
  <!-- Directed Tree / Graph Logic Traces (Root to Children) -->
  <line x1="14" y1="7" x2="8" y2="20" stroke="#090908" stroke-width="2.2" stroke-linecap="round" />
  <line x1="14" y1="7" x2="20" y2="20" stroke="#090908" stroke-width="2.2" stroke-linecap="round" />
  
  <!-- Horizontal Dashed Connection Between Sibling Nodes -->
  <line x1="8" y1="20" x2="20" y2="20" stroke="#090908" stroke-width="1.8" stroke-dasharray="2 2" />
  
  <!-- 3 Crisp Schematic Vertex Nodes -->
  <circle cx="14" cy="7" r="3" fill="#090908" />
  <circle cx="8" cy="20" r="3" fill="#090908" />
  <circle cx="20" cy="20" r="3" fill="#090908" />
</svg>
