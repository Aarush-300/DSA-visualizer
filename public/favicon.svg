<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Precision International Orange Hardware Base -->
  <rect width="32" height="32" rx="3" fill="#FF4F00" />
  
  <!-- Circuit Traces -->
  <line x1="16" y1="8" x2="8" y2="23" stroke="#090908" stroke-width="2.5" stroke-linecap="square" />
  <line x1="16" y1="8" x2="24" y2="23" stroke="#090908" stroke-width="2.5" stroke-linecap="square" />
  <line x1="11" y1="17" x2="21" y2="17" stroke="#090908" stroke-width="2" />
  
  <!-- Graph / Tree Nodes -->
  <circle cx="16" cy="8" r="3" fill="#090908" />
  <circle cx="8" cy="23" r="2.8" fill="#090908" />
  <circle cx="24" cy="23" r="2.8" fill="#090908" />
  
  <!-- Central Logic Core -->
  <rect x="14.5" y="15.5" width="3" height="3" fill="#090908" />
</svg>
